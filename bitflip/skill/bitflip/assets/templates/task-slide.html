<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bitflip Aufgabenfolie</title>
<link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;background:var(--paper)}
/* 16:9, 1280 × 720 */
.frame{position:relative;width:1280px;height:720px;background:var(--surface);overflow:hidden}
.chip{position:absolute;left:80px;top:68px;font:800 26px var(--font-mono);letter-spacing:.08em;padding:14px 28px;border-radius:var(--radius-pill);background:var(--amber);color:#0B0F14}
h1{position:absolute;left:80px;top:168px;margin:0;font:800 68px/1.1 var(--font-mono);letter-spacing:-.05em;color:var(--ink)}
ul{position:absolute;left:80px;top:284px;width:580px;margin:0;padding-left:40px;font:400 34px/1.65 var(--font-sans);color:var(--ink)}
.win{position:absolute;left:740px;right:56px;top:68px;bottom:112px;border-radius:var(--radius-md);background:var(--code-bg);padding:32px 36px;font:400 26px/1.75 var(--font-mono);color:var(--code-text)}
.win .c{color:var(--amber)}.win .g{color:#A3ADBA}
.foot{position:absolute;left:80px;right:68px;bottom:44px;display:flex;justify-content:space-between;font:500 24px var(--font-mono);color:var(--muted)}
</style>
</head>
<body>
<div class="frame">
<div class="chip">AUFGABE 03</div>
<h1>VLANs planen<span style="color:var(--amber)">_</span></h1>
<ul><li>Drei Subnetze nach Abteilung anlegen</li><li>Ports dem passenden VLAN zuordnen</li><li>Erreichbarkeit mit ping prüfen</li></ul>
<div class="win"><span class="c"># VLAN 30 · Vertrieb</span><br><span class="c">$</span> vlan add 30<br><span class="c">$</span> ping -c 3 10.0.30.1<br><span class="g">64 bytes · time=0.41 ms</span></div>
<div class="foot"><span>bitflip_</span><span>03 / 12 · 20 min</span></div>
</div>
</body>
</html>
