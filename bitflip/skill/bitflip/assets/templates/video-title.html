<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bitflip Videotitel</title>
<link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;background:var(--surface)}
/* 16:9, Maße in px: 1280 × 720 entspricht 2 × 640 × 360 */
.frame{position:relative;width:1280px;height:720px;background:var(--paper);overflow:hidden}
.kick{position:absolute;left:80px;top:72px;font:500 28px var(--font-mono);letter-spacing:.12em;color:var(--amber-text)}
h1{position:absolute;left:80px;top:168px;width:600px;margin:0;font:800 72px/1.08 var(--font-mono);letter-spacing:-.05em;color:var(--ink)}
h1::after{content:"_";color:var(--amber)}
.bar{position:absolute;left:80px;top:524px;width:144px;height:12px;border-radius:6px;background:var(--amber)}
.foot{position:absolute;left:80px;bottom:64px;font:700 28px var(--font-mono);color:var(--ink)}
.foot b{color:var(--amber-text)}
.foot i{font-style:normal;font-weight:400;color:var(--muted);margin-left:20px}
.scene{position:absolute;right:12px;top:68px;width:700px}
</style>
</head>
<body>
<div class="frame">
<div class="kick">// MODUL 03 · NETZWERK</div>
<h1>Subnetting ohne Kopf&shy;schmerzen</h1>
<div class="bar"></div>
<div class="foot">bit<b>flip_</b><i>12 min</i></div>
<img class="scene" src="../scene.svg" alt="Inselszene mit Server, Lernpaket und Würfeltreppe">
</div>
</body>
</html>
